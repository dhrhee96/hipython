<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>에러 페이지</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #fff5f5;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .error-box {
      background: white;
      padding: 40px;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
      max-width: 500px;
    }

    h1 {
      font-size: 72px;
      margin: 0;
      color: #e74c3c;
    }

    h2 {
      margin: 10px 0 20px;
    }

    p {
      color: #666;
      margin-bottom: 25px;
    }

    a {
      display: inline-block;
      padding: 12px 20px;
      background: #e74c3c;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    a:hover {
      background: #c0392b;
    }
  </style>
</head>

<body>
  <div class="error-box">
    <h1>404</h1>
    <h2>페이지를 찾을 수 없습니다</h2>
    <p>요청하신 페이지가 존재하지 않거나 이동되었을 수 있습니다.</p>
    <a href="index.html">메인 페이지로 돌아가기</a>
  </div>
</body>

</html>
